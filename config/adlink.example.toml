# AdLink Production Configuration Example
# Copy to `config/adlink.local.toml` and populate environment variables before starting.

[server]
host = "0.0.0.0"
port = 8787
web_dir = "web-starter"
max_in_flight_requests = 512
request_timeout_secs = 30
max_body_bytes = 16777216 # 16 MiB
rate_limit_rps = 120
rate_limit_burst = 240
analytics_cache_ttl_secs = 30
analytics_cache_max_entries = 1024
idempotency_ttl_secs = 600
job_queue_capacity = 128
job_worker_concurrency = 4
scheduled_sync_interval_secs = 0 # Set e.g. 1800 for 30-min automatic trailing sync
# webhook_url = "https://ops-webhook.example.com/adlink-sync-events"
# cors_allowed_origins = ["https://console.example.com"]
log_format = "json"
shutdown_drain_secs = 15

[storage]
db_path = "data/adlink.db"
reader_pool_size = 8

[fx_rates]
# Base accounting currency is CNY (Fen = 0.01 CNY). Override daily FX spots if needed:
USD = 7.25
EUR = 7.85
GBP = 9.15
JPY = 0.048
HKD = 0.93
SGD = 5.40
AUD = 4.75
CAD = 5.25

[auth]
# Protect REST API + MCP HTTP endpoints with Bearer tokens or X-Api-Key
api_keys = ["${ADLINK_API_KEY}"]

[guardrail]
max_daily_budget_fen = 50000000 # ¥500,000 hard cap per ad mutation
max_bid_fen = 500000            # ¥5,000 hard bid cap
max_batch_size = 20

# Opt-In Ad Creation (广告创编：新建计划/单元/创意)
# SECURITY DEFAULT: DISABLED (`enabled = false`, `risk_acknowledged = false`).
# 创编涉及真实资金消耗与审核封户风险，默认关闭。接入前必须先询问用户并告知风险！
[ad_creation]
enabled = false
risk_acknowledged = false
require_dry_run_preview = true
max_initial_daily_budget_fen = 10000000 # ¥100,000 cap on initial budget
max_initial_bid_fen = 300000            # ¥3,000 cap on initial bid
# allowed_platforms = ["tencent_ads", "ocean_engine_ad", "kuaishou"]

# ------------------------------------------------------------------
# Two-Tier Platform Login / Auth Strategy per connector:
# - Optimal (Tier 1): auth_strategy = "official_mcp_bridge" + official_mcp_endpoint
#   -> Reuse official media platform MCP login/auth, then re-label 人-户/项目关系 in AdLink
# - Fallback (Tier 2): auth_strategy = "direct_api_account_discovery"
#   -> Pull advertiser sub-accounts directly via Marketing API and bootstrap custom projects
# ------------------------------------------------------------------

# 1. 腾讯社交广告 (AMS v3.0)
[connectors.tencent_ads]
mode = "live"
auth_strategy = "official_mcp_bridge"
# official_mcp_endpoint = "https://official-tencent-ads-mcp.example.com/mcp"
# official_mcp_auth_tool = "list_accounts"
app_id = "${TENCENT_ADS_APP_ID}"
app_secret = "${TENCENT_ADS_SECRET}"
access_token = "${TENCENT_ADS_ACCESS_TOKEN}"
refresh_token = "${TENCENT_ADS_REFRESH_TOKEN}"

# 2. 小红书聚光
[connectors.xhs_juguang]
mode = "live"
app_id = "${XHS_APP_ID}"
app_secret = "${XHS_APP_SECRET}"
access_token = "${XHS_ACCESS_TOKEN}"

# 3. 小红书乘风
[connectors.xhs_chengfeng]
mode = "live"
app_id = "${XHS_APP_ID}"
app_secret = "${XHS_APP_SECRET}"
access_token = "${XHS_ACCESS_TOKEN}"

# 4. 小红书蒲公英 (白名单 Partner API 或通过 /api/v1/ingest 导入官方导出文件)
[connectors.xhs_pugongying]
mode = "mock"
# mode = "live"
# access_token = "${XHS_PGY_PARTNER_TOKEN}"
# base_url_override = "https://partner-gateway.example.com"

# 5. B站三连 / 商业起飞
[connectors.bilibili_sanlian]
mode = "live"
access_token = "${BILI_ACCESS_TOKEN}"
call_source = "${BILI_CALL_SOURCE}"

# 6. B站花火商单 (白名单 Partner API 或通过 /api/v1/ingest 导入官方导出文件)
[connectors.bilibili_huahuo]
mode = "mock"
# mode = "live"
# access_token = "${BILI_HUAHUO_PARTNER_TOKEN}"
# base_url_override = "https://partner-gateway.example.com"

# 7. 快手磁力引擎
[connectors.kuaishou]
mode = "live"
app_id = "${KS_APP_ID}"
app_secret = "${KS_APP_SECRET}"
access_token = "${KS_ACCESS_TOKEN}"

# 8. 巨量引擎 AD v3.0
[connectors.ocean_engine_ad]
mode = "live"
app_id = "${OCEAN_APP_ID}"
app_secret = "${OCEAN_APP_SECRET}"
access_token = "${OCEAN_ACCESS_TOKEN}"

# 9. 巨量本地推 v3.0
[connectors.ocean_engine_local]
mode = "live"
app_id = "${OCEAN_APP_ID}"
app_secret = "${OCEAN_APP_SECRET}"
access_token = "${OCEAN_ACCESS_TOKEN}"

# 10. 支付宝灯火 (纯 Rust RSA2 签名)
[connectors.alipay_denghuo]
mode = "live"
app_id = "${ALIPAY_APP_ID}"
rsa2_private_key_pem = "${ALIPAY_RSA2_PRIVATE_KEY}"
biz_token = "${ALIPAY_BIZ_TOKEN}"
alipay_pid = "${ALIPAY_PID}"

# ------------------------------------------------------------------
# Overseas Platforms (Multi-Currency -> Canonical CNY Fen via [fx_rates])
# ------------------------------------------------------------------

# 11. TikTok For Business (Marketing API v1.3)
[connectors.tiktok_ads]
mode = "live"
access_token = "${TIKTOK_ADS_ACCESS_TOKEN}"
currency = "USD"

# 12. Meta Ads / Facebook & Instagram (Graph Marketing API v21.0)
# Note: Insights `spend` is major currency string; campaign/adset budgets convert automatically to cents!
[connectors.meta_ads]
mode = "live"
access_token = "${META_ADS_ACCESS_TOKEN}"
currency = "USD"

# 13. Google Ads (API v18 GAQL `googleAds:searchStream` - costMicros -> Fen)
[connectors.google_ads]
mode = "live"
access_token = "${GOOGLE_ADS_ACCESS_TOKEN}"
developer_token = "${GOOGLE_ADS_DEVELOPER_TOKEN}"
login_customer_id = "${GOOGLE_ADS_MCC_ID}"
currency = "USD"

# 14. Apple Search Ads (Campaign Management API v5 + Pure-Rust ES256 P-256 JWT)
# Warning: ASA v5 is scheduled for sunset Jan 2027. Supply named_curve PKCS#8 ES256 private key PEM.
[connectors.apple_search_ads]
mode = "live"
app_id = "${APPLE_ADS_CLIENT_ID}"
team_id = "${APPLE_ADS_TEAM_ID}"
key_id = "${APPLE_ADS_KEY_ID}"
es256_private_key_pem = "${APPLE_ADS_ES256_KEY_PEM}"
access_token = "${APPLE_ADS_ACCESS_TOKEN}"
org_id = "${APPLE_ADS_ORG_ID}"
currency = "USD"

# 15. Amazon Ads (Reporting v3 Async + Sponsored Products /sp/* - max 31d/chunk)
# Note: Amazon Reporting v3 has announced June 2027 migration to unified reporting.
[connectors.amazon_ads]
mode = "live"
access_token = "${AMAZON_ADS_ACCESS_TOKEN}"
app_id = "${AMAZON_ADS_CLIENT_ID}"
amazon_profile_id = "${AMAZON_ADS_PROFILE_ID}"
currency = "USD"
