# AdLink Zero-Config Mock Sandbox Configuration
# Run: adlink serve --config config/adlink.mock.toml --seed-mock

[server]
host = "0.0.0.0"
port = 8787
web_dir = "web-starter"
max_in_flight_requests = 512
request_timeout_secs = 30
max_body_bytes = 16777216
rate_limit_rps = 120
rate_limit_burst = 240
analytics_cache_ttl_secs = 30
analytics_cache_max_entries = 1024
idempotency_ttl_secs = 600
job_queue_capacity = 128
job_worker_concurrency = 4
scheduled_sync_interval_secs = 0
log_format = "text"
shutdown_drain_secs = 15

[storage]
db_path = "data/adlink-mock.db"
reader_pool_size = 8

[fx_rates]
USD = 7.25
EUR = 7.85
GBP = 9.15
JPY = 0.048
HKD = 0.93

[auth]
# Leave empty in local development/mock mode to allow unauthenticated local testing.
api_keys = []

[guardrail]
max_daily_budget_fen = 50000000 # ¥500,000
max_bid_fen = 500000            # ¥5,000
max_batch_size = 20

# Opt-In Ad Creation (创编：新建计划/单元/创意)
# SECURITY DEFAULT: DISABLED (`enabled = false`, `risk_acknowledged = false`).
# Always ask the user whether they want to enable Ad Creation and disclose risks first.
[ad_creation]
enabled = false
risk_acknowledged = false
require_dry_run_preview = true
max_initial_daily_budget_fen = 10000000 # ¥100,000
max_initial_bid_fen = 300000            # ¥3,000

[connectors.tencent_ads]
mode = "mock"

[connectors.xhs_juguang]
mode = "mock"

