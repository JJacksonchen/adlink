# AdLink Production Kubernetes Manifest
# Uses a single-writer StatefulSet (`replicas: 1`) paired with an 8-connection SQLite WAL
# read-only pool inside the pod so concurrent analytical reads scale cleanly with durable PVC storage.
apiVersion: v1
kind: Service
metadata:
  name: adlink
  labels:
    app.kubernetes.io/name: adlink
spec:
  selector:
    app.kubernetes.io/name: adlink
  ports:
    - name: http
      port: 8787
      targetPort: 8787
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: adlink
  labels:
    app.kubernetes.io/name: adlink
spec:
  serviceName: adlink
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adlink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adlink
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8787"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: adlink
          image: ghcr.io/zyfjacksonchen-source/adlink:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/app/config/adlink.mock.toml"]
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: ADLINK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: adlink-secrets
                  key: api_key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          volumeMounts:
            - name: adlink-wal-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: adlink-wal-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
